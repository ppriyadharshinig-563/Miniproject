services:
  - type: web
    name: smart-transit-backend
    env: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: MYSQL_URL
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: smart_bus_db
